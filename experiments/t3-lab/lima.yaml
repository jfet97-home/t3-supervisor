minimumLimaVersion: 2.2.1
vmType: vz
arch: aarch64

# pinned Ubuntu 24.04 minimal image from Lima 2.2.1's official template
images:
  - location: https://cloud-images.ubuntu.com/minimal/releases/noble/release-20261001/ubuntu-24.04-minimal-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:fbf6b15c50c474dc6dee5b3c74da212bb687a2625e877227828e6492d88dc151

cpus: 4
memory: 8GiB
disk: 60GiB

# disable host mounts, dynamic port forwarding, containerd and SSH agent forwarding
plain: true
mounts: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
propagateProxyEnv: false
