name: t3-supervisor

services:
  t3-supervisor:
    image: ghcr.io/jfet97/t3-supervisor:${SUPERVISOR_VERSION:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    user: "${LOCAL_UID:?set LOCAL_UID}:${LOCAL_GID:?set LOCAL_GID}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 768m
    environment:
      T3_URL: "${T3_URL:-http://host.docker.internal:3773}"
      T3_TOKEN_FILE: /run/secrets/t3-read-token
      DATA_DIRECTORY: /data
      HEALTH_PORT: "9007"
      UI_PORT: "9008"
      UI_HOST: "0.0.0.0"
      WORKFLOW_MCP_HOSTS: "${WORKFLOW_MCP_HOSTS:-t3-supervisor:9008}"
      T3_GUIDANCE_TOKEN_FILE: /run/secrets/t3-guidance-token
      T3_PROJECT_WRITE_TOKEN_FILE: /run/secrets/t3-project-write-token
      T3_PROJECT_COMMIT_TOKEN_FILE: /run/secrets/t3-project-commit-token
      T3_GIT_PROBE_TOKEN_FILE: /run/secrets/t3-git-probe-token
      T3_MANAGED_SCRATCH_ROOT: "${T3_MANAGED_SCRATCH_ROOT:-/tmp/t3-scratch}"
    volumes:
      - ${SUPERVISOR_DATA_DIR:?set SUPERVISOR_DATA_DIR}:/data
      - ${SUPERVISOR_SECRETS_DIR:?set SUPERVISOR_SECRETS_DIR}:/run/secrets:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports: ["127.0.0.1:9007:9007", "127.0.0.1:9008:9008"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9007/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
