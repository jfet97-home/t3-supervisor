name: Check Supervisor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  main:
    name: main (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --shard=${{ matrix.shard }}/4 --maxWorkers=1

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:harness

  check:
    if: ${{ always() }}
    needs: [static, main, harness]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation job to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          MAIN_RESULT: ${{ needs.main.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$MAIN_RESULT" = success
          test "$HARNESS_RESULT" = success
